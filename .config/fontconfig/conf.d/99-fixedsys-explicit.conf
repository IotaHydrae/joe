<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep explicitly requested Fixedsys ahead of language-based generic aliases.
       Preserve CJK and color emoji fallbacks without overriding generic monospace. -->
  <match target="pattern">
    <test qual="any" name="family" compare="eq">
      <string>Fixedsys Excelsior</string>
    </test>
    <edit name="family" mode="assign_replace" binding="strong">
      <string>Fixedsys Excelsior</string>
      <string>Noto Sans Mono CJK SC</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
